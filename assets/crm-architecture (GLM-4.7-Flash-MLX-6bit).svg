<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- Main Container -->
  <rect x="20" y="20" width="760" height="560" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1" rx="10"/>

  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">Simple CRM Web Architecture</text>

  <!-- API Layer -->
  <rect x="250" y="80" width="300" height="80" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="8"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976D2" text-anchor="middle">API Layer</text>
  <rect x="280" y="125" width="100" height="40" fill="#BBDEFB" rx="4"/>
  <text x="330" y="150" font-family="Arial, sans-serif" font-size="12" fill="#1565C0" text-anchor="middle">JSON Server</text>
  <rect x="420" y="125" width="100" height="40" fill="#BBDEFB" rx="4"/>
  <text x="470" y="150" font-family="Arial, sans-serif" font-size="12" fill="#1565C0" text-anchor="middle">Mock Data</text>

  <!-- Data Flow Arrows -->
  <line x1="400" y1="160" x2="400" y2="180" stroke="#2196F3" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Context Layer -->
  <rect x="250" y="180" width="300" height="100" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="8"/>
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F57C00" text-anchor="middle">Context Layer</text>
  <rect x="280" y="225" width="240" height="50" fill="#FFE0B2" rx="4"/>
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="12" fill="#E65100" text-anchor="middle">AuthContext | CustomerContext | CustomerReducer</text>

  <!-- Data Flow Arrows -->
  <line x1="400" y1="280" x2="400" y2="300" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Components Layer -->
  <rect x="250" y="300" width="300" height="120" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="8"/>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#388E3C" text-anchor="middle">Components Layer</text>
  <rect x="280" y="345" width="100" height="30" fill="#C8E6C9" rx="4"/>
  <text x="330" y="365" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle">Header</text>
  <rect x="390" y="345" width="100" height="30" fill="#C8E6C9" rx="4"/>
  <text x="440" y="365" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle">Sidebar</text>
  <rect x="500" y="345" width="80" height="30" fill="#C8E6C9" rx="4"/>
  <text x="540" y="365" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle">Cards</text>
  <rect x="310" y="385" width="180" height="30" fill="#C8E6C9" rx="4"/>
  <text x="400" y="405" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle">SearchBars | Spinners</text>

  <!-- Data Flow Arrows -->
  <line x1="400" y1="420" x2="400" y2="440" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Pages Layer -->
  <rect x="250" y="440" width="300" height="100" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" rx="8"/>
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7B1FA2" text-anchor="middle">Pages Layer</text>
  <rect x="280" y="485" width="110" height="40" fill="#E1BEE7" rx="4"/>
  <text x="335" y="505" font-family="Arial, sans-serif" font-size="10" fill="#4A148C" text-anchor="middle">Dashboard</text>
  <rect x="400" y="485" width="110" height="40" fill="#E1BEE7" rx="4"/>
  <text x="455" y="505" font-family="Arial, sans-serif" font-size="10" fill="#4A148C" text-anchor="middle">Customers</text>
  <rect x="310" y="535" width="180" height="30" fill="#E1BEE7" rx="4"/>
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="10" fill="#4A148C" text-anchor="middle">Products | Edit | Detail</text>

  <!-- Data Flow Arrows -->
  <line x1="400" y1="540" x2="400" y2="560" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Router Layer -->
  <rect x="250" y="560" width="300" height="30" fill="#ECEFF1" stroke="#607D8B" stroke-width="2" rx="8"/>
  <text x="400" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#455A64" text-anchor="middle">React Router 7</text>

  <!-- Icon Definitions -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2196F3"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9C27B0"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="20" y="500" width="130" height="80" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1" rx="5"/>
  <text x="85" y="515" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#212529" text-anchor="middle">Legend</text>
  <rect x="30" y="525" width="10" height="10" fill="#E3F2FD"/>
  <text x="45" y="535" font-family="Arial, sans-serif" font-size="8" fill="#212529">API Layer</text>
  <rect x="30" y="540" width="10" height="10" fill="#FFF3E0"/>
  <text x="45" y="550" font-family="Arial, sans-serif" font-size="8" fill="#212529">Context Layer</text>
  <rect x="30" y="555" width="10" height="10" fill="#E8F5E9"/>
  <text x="45" y="565" font-family="Arial, sans-serif" font-size="8" fill="#212529">Component Layer</text>
</svg>