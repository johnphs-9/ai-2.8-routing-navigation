<svg width="1200" height="550" viewBox="0 0 1200 550" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; }
    .layer { fill: #f8f9fa; stroke: #212529; stroke-width: 2; }
    .layer-title { fill: #212529; font-size: 16px; font-weight: bold; font-family: Arial, sans-serif; }
    .component { fill: #ffffff; stroke: #495057; stroke-width: 2; }
    .component-title { fill: #212529; font-size: 13px; font-weight: 600; font-family: Arial, sans-serif; }
    .small { font-size: 10px; fill: #6c757d; font-family: monospace; }
    .arrow { stroke: #dc3545; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-label { fill: #dc3545; font-size: 10px; font-family: monospace; }
    .api { fill: #fff3cd; stroke: #856404; stroke-width: 2; }
    .context { fill: #d1ecf1; stroke: #0c5460; stroke-width: 2; }
    .data { fill: #d4edda; stroke: #155724; stroke-width: 2; }
    .reducer { fill: #f8d7da; stroke: #721c24; stroke-width: 2; }
    .route { fill: #d1e7dd; stroke: #0f5132; stroke-width: 2; }
    .feedback { fill: #d1ecf1; stroke: #0c5460; stroke-width: 2; }
  </style>
  
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="10" refX="2" refY="5" orient="auto">
      <polygon points="0 0, 6 5, 0 10" fill="#dc3545"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="550" class="bg"/>
  
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" fill="#212529" font-size="18px" font-weight="bold" font-family="Arial, sans-serif">Simple CRM Web - Technical Architecture</text>
  
  <!-- CLIENT LAYER -->
  <rect x="120" y="55" width="960" height="160" class="layer" rx="8"/>
  <text x="600" y="80" text-anchor="middle" class="layer-title">Client Application Layer</text>
  
  <!-- Browser -->
  <rect x="130" y="95" width="420" height="45" class="component" rx="5"/>
  <text x="340" y="120" text-anchor="middle" class="component-title">React Application (Client Browser)</text>
  
  <!-- App Structure -->
  <rect x="130" y="150" width="420" height="55" class="route" rx="5"/>
  <text x="340" y="170" text-anchor="middle" class="component-title">App.jsx - React Router</text>
  
  <!-- Contexts (left side of app) -->
  <rect x="140" y="215" width="130" height="65" class="context" rx="5"/>
  <text x="205" y="230" text-anchor="middle" class="component-title">AuthContext</text>
  <text x="205" y="245" class="small">login, logout, hasRole</text>
  
  <rect x="280" y="215" width="150" height="65" class="context" rx="5"/>
  <text x="355" y="230" text-anchor="middle" class="component-title">CustomerContext</text>
  <text x="355" y="245" class="small">CRUD operations</text>
  
  <!-- Layouts (center) -->
  <rect x="450" y="215" width="110" height="65" class="component" rx="5"/>
  <text x="505" y="230" text-anchor="middle" class="component-title">RootLayout</text>
  <text x="505" y="245" class="small">Sidebar + &lt;Outlet/&gt;</text>
  
  <!-- Pages (right side of app) -->
  <rect x="570" y="215" width="250" height="85" class="component" rx="5"/>
  <text x="695" y="230" text-anchor="middle" class="component-title">Pages</text>
  
  <rect x="580" y="240" width="60" height="35" class="component" fill="#f8f9fa"/>
  <text x="610" y="255" text-anchor="middle" font-size="10px" fill="#495057">Login</text>
  
  <rect x="650" y="240" width="70" height="35" class="component" fill="#f8f9fa"/>
  <text x="685" y="255" text-anchor="middle" font-size="10px" fill="#495057">Dashboard</text>
  
  <rect x="580" y="285" width="100" height="35" class="component" fill="#f8f9fa"/>
  <text x="630" y="300" text-anchor="middle" font-size="10px" fill="#495057">Customers</text>
  
  <rect x="690" y="285" width="90" height="35" class="component" fill="#f8f9fa"/>
  <text x="735" y="300" text-anchor="middle" font-size="10px" fill="#495057">Products</text>
  
  <!-- Client Data (bottom left) -->
  <rect x="130" y="290" width="380" height="55" class="data" rx="5"/>
  <text x="320" y="310" text-anchor="middle" class="component-title">Client-Side Data</text>
  
  <rect x="140" y="315" width="70" height="25" fill="#f8d7da" stroke="#721c24" stroke-width="1.5"/>
  <text x="175" y="332" text-anchor="middle" font-size="10px" fill="#721c24">users.js</text>
  
  <rect x="220" y="315" width="180" height="25" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="310" y="332" text-anchor="middle" font-size="10px" fill="#155724">db.json</text>
  
  <rect x="410" y="315" width="80" height="25" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/>
  <text x="450" y="332" text-anchor="middle" font-size="10px" fill="#856404">products.js</text>
  
  <!-- Reducer (bottom center) -->
  <rect x="510" y="290" width="180" height="55" class="reducer" rx="5"/>
  <text x="600" y="310" text-anchor="middle" class="component-title">Reducers</text>
  
  <rect x="520" y="315" width="160" height="25" fill="#f8d7da" stroke="#721c24" stroke-width="1.5"/>
  <text x="600" y="332" text-anchor="middle" font-size="10px" fill="#721c24">customerReducer</text>
  <text x="600" y="345" class="small">FETCH, ADD, UPDATE, DELETE</text>
  
  <!-- API LAYER -->
  <rect x="120" y="365" width="960" height="100" class="layer" rx="8"/>
  <text x="600" y="390" text-anchor="middle" class="layer-title">Server/API Layer</text>
  
  <!-- db.json (mock data) -->
  <rect x="150" y="405" width="240" height="60" class="data" rx="5"/>
  <text x="270" y="425" text-anchor="middle" class="component-title">data/db.json (Mock API)</text>
  
  <rect x="160" y="435" width="220" height="25" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="270" y="450" text-anchor="middle" font-size="10px" fill="#155724">customers: [{id, name, email, status, tags}]</text>
  
  <rect x="160" y="465" width="220" height="25" fill="#d4edda" stroke="#155724" stroke-width="1.5"/>
  <text x="270" y="480" text-anchor="middle" font-size="10px" fill="#155724">products: [{id, name, price, category}]</text>
  
  <!-- json-server -->
  <rect x="420" y="405" width="180" height="60" class="api" rx="5"/>
  <text x="510" y="425" text-anchor="middle" class="component-title">json-server</text>
  <text x="510" y="440" class="small">--watch data/db.json --port 3001</text>
  
  <!-- NODE LAYER -->
  <rect x="120" y="475" width="960" height="75" class="layer" rx="8"/>
  <text x="600" y="500" text-anchor="middle" class="layer-title">Node.js Server</text>
  
  <!-- Connection arrows -->
  <line x1="550" y1="160" x2="550" y2="365" class="arrow"/>
  <text x="550" y="280" text-anchor="middle" class="arrow-label">GET requests to localhost:3001</text>
  
  <line x1="330" y1="410" x2="330" y2="475" class="arrow"/>
  <text x="330" y="450" text-anchor="middle" class="arrow-label">GET/POST/PATCH/DELETE requests</text>
  
  <!-- Data Flow Arrows -->
  <line x1="630" y1="350" x2="630" y2="365" class="arrow"/>
  <text x="630" y="380" text-anchor="middle" class="arrow-label">Serves API requests</text>
  
  <!-- CONNECTIONS -->
  <line x1="250" y1="350" x2="250" y2="365" class="arrow"/>
  <text x="250" y="380" text-anchor="middle" class="arrow-label">Context API calls API</text>
  
  <line x1="650" y1="470" x2="650" y2="530" class="arrow"/>
  <text x="650" y="500" text-anchor="middle" class="arrow-label">Reads from db.json</text>
  
  <line x1="650" y1="535" x2="550" y2="535" class="arrow"/>
  <text x="600" y="550" text-anchor="middle" class="arrow-label">Modified data written back</text>
  
  <!-- SCHEMAS -->
  <rect x="250" y="510" width="220" height="30" class="data" rx="5"/>
  <text x="360" y="530" text-anchor="middle" class="component-title">Customer Schema</text>
  <text x="360" y="542" font-size="9px" fill="#155724">id, firstName, lastName, email, phone, status, tags, company, notes, createdAt</text>
  
  <rect x="490" y="510" width="220" height="30" class="data" rx="5"/>
  <text x="600" y="530" text-anchor="middle" class="component-title">Product Schema</text>
  <text x="600" y="542" font-size="9px" fill="#155724">id, name, price, category</text>
  
  <!-- TECH STACK -->
  <rect x="120" y="545" width="960" height="40" class="layer" rx="8" fill="#e9ecef"/>
  <text x="600" y="565" text-anchor="middle" class="layer-title" font-size="12px" fill="#495057">Tech Stack</text>
  <text x="220" y="578" font-size="9px" fill="#6c757d">React 19, React Router 7, Context API, Vite, json-server, Node.js v8</text>
</svg>
