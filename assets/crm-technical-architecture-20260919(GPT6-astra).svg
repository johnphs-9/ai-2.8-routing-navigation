<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
<title id="title">Simple CRM — technical architecture and design</title>
<desc id="desc">Implemented React and Vite single-page application. Browser routing and in-memory authentication guard the CRM screens. Customer context and detail pages call JSON Server on localhost port 3001, backed by data/db.json. Products are bundled static data. No AI runtime is implemented.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<rect width="1500" height="1120" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b42}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#526479}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#526479}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#526479}.code{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#526479}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}</style>
<text x="48" y="54" class="title">Simple CRM</text>
<text x="48" y="86" class="sub">Technical architecture &amp; design  /  AI Engineering</text>
<text x="1452" y="53" text-anchor="end" class="eyebrow">AS IMPLEMENTED</text>
<text x="48" y="129" class="eyebrow">01  BROWSER APPLICATION</text>
<text x="1100" y="129" class="eyebrow">02  LOCAL DATA SERVICE</text>
<rect x="48" y="150" width="986" height="668" rx="12" fill="white" stroke="#b7c7d9" stroke-width="1.5"/>
<text x="72" y="184" class="head">React 19 · React Router 7</text>
<text x="72" y="210" class="code">main.jsx → AuthProvider → CustomerProvider → App</text>
<rect x="72" y="236" width="445" height="158" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="92" y="268" class="head">Navigation &amp; screen composition</text>
<text x="92" y="299" class="body">Public: / welcome · /login · * not found</text>
<text x="92" y="324" class="body">Protected: /app → dashboard, customers, products</text>
<text x="92" y="349" class="body">RootLayout → Sidebar + nested route Outlet</text>
<rect x="565" y="236" width="445" height="158" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="585" y="268" class="head">Browser-only authentication</text>
<text x="585" y="299" class="body">LoginPage checks src/data/users.js</text>
<text x="585" y="324" class="body">AuthContext holds user in memory</text>
<text x="585" y="349" class="body">ProtectedRoute redirects guests to /login</text>
<path d="M517 314 H565" class="line"/>
<text x="72" y="438" class="eyebrow">CUSTOMER WORKFLOW</text>
<rect x="72" y="454" width="445" height="148" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="92" y="486" class="head">Customer screens</text>
<text x="92" y="517" class="body">Dashboard counts · searchable customer list</text>
<text x="92" y="542" class="body">Create · detail (:id) · edit (:id/edit)</text>
<text x="92" y="567" class="body">CustomerCard triggers confirmed deletion</text>
<rect x="565" y="454" width="445" height="148" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="585" y="486" class="head">CustomerContext + reducer</text>
<text x="585" y="517" class="body">GET list · POST · PATCH · DELETE</text>
<text x="585" y="542" class="body">Customer state, loading and submit status</text>
<text x="585" y="567" class="body">Local name/email search + status filter</text>
<path d="M517 524 H565" class="line"/>
<text x="541" y="512" text-anchor="middle" class="small">actions</text>
<path d="M565 576 H517" class="line"/>
<text x="541" y="566" text-anchor="middle" class="small">state</text>
<path d="M1010 510 H1100" class="line"/>
<text x="1054" y="496" text-anchor="middle" class="small">fetch</text>
<path d="M295 602 V636 H1054 V556 H1100" class="line"/>
<text x="580" y="628" class="small">Detail + edit pages: direct GET /customers/:id</text>
<rect x="72" y="666" width="445" height="125" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="92" y="698" class="head">Product catalogue</text>
<text x="92" y="729" class="body">ProductsPage → search → discount → ProductList</text>
<text x="92" y="754" class="body">Local search and cart-count state</text>
<rect x="565" y="666" width="445" height="125" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="585" y="698" class="head">Bundled product fixtures</text>
<text x="585" y="729" class="body">data/products.js · 1,000 mock products</text>
<text x="585" y="754" class="body">Generated by scripts/generate-products.js</text>
<path d="M565 731 H517" class="line"/>
<rect x="1100" y="454" width="352" height="148" rx="12" fill="white" stroke="#9bbeb7" stroke-width="1.5"/>
<text x="1120" y="486" class="head">JSON Server</text>
<text x="1120" y="517" class="body">http://localhost:3001</text>
<text x="1120" y="542" class="body">/customers · /customers/:id</text>
<text x="1120" y="567" class="body">HTTP requests / JSON responses</text>
<path d="M1276 602 V666" class="line"/>
<text x="1291" y="639" class="small">read / write</text>
<rect x="1100" y="666" width="352" height="125" rx="12" fill="white" stroke="#9bbeb7" stroke-width="1.5"/>
<text x="1120" y="698" class="head">File persistence</text>
<text x="1120" y="729" class="body">data/db.json</text>
<text x="1120" y="754" class="body">Customer records</text>
<rect x="1100" y="236" width="352" height="158" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="1120" y="268" class="head">Customer data design</text>
<text x="1120" y="299" class="body">id · name · email · phone</text>
<text x="1120" y="324" class="body">company · notes · createdAt</text>
<text x="1120" y="349" class="body">status · tags[]</text>
<text x="1120" y="376" class="small">No customer–product relationship</text>
<text x="48" y="861" class="eyebrow">03  EXECUTION &amp; ENGINEERING BOUNDARIES</text>
<rect x="48" y="882" width="460" height="162" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="68" y="914" class="head">Local development &amp; build</text>
<text x="68" y="945" class="body">npm run dev → Vite serves the React app</text>
<text x="68" y="970" class="body">npm run server → JSON Server on port 3001</text>
<text x="68" y="995" class="body">npm run build → static dist/ assets</text>
<text x="68" y="1020" class="body">CSS Modules + global CSS style the UI</text>
<rect x="530" y="882" width="440" height="162" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="550" y="914" class="head">Design constraints</text>
<text x="550" y="945" class="body">Login guards the UI; the API has no auth</text>
<text x="550" y="970" class="body">CustomerProvider fetches before login</text>
<text x="550" y="995" class="body">Refresh clears the in-memory session</text>
<text x="550" y="1020" class="body">Route role checks are not configured</text>
<rect x="992" y="882" width="460" height="162" rx="12" fill="white" stroke="#d6dee8" stroke-width="1.5"/>
<text x="1012" y="914" class="head">AI Engineering scope</text>
<text x="1012" y="945" class="body">This repository implements the CRM foundation</text>
<text x="1012" y="970" class="body">No model, inference API or agent orchestration</text>
<text x="1012" y="995" class="body">No embeddings, retrieval or evaluation pipeline</text>
<text x="1012" y="1020" class="body">No AI service is assumed in this diagram</text>
<text x="48" y="1085" class="small">Evidence: src/main.jsx · src/App.jsx · contexts/ · pages/ · reducers/ · data/ · package.json</text>
<text x="1452" y="1085" text-anchor="end" class="small">Scope: this project folder only</text>
</svg>